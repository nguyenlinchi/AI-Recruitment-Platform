
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Recruitment Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 10px #0000000a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        nav a {
            margin-left: 24px;
            color: #475569;
            text-decoration: none;
        }

        main {
            min-height: 75vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 52px);
            margin-bottom: 20px;
        }

        h1 span {
            color: #2563eb;
        }

        p {
            color: #64748b;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 28px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">AI Career</div>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Việc làm</a>
            <a href="#">Công ty</a>
            <a href="#">Đăng nhập</a>
        </nav>
    </header>

    <main>
        <div>
            <h1>Tìm kiếm công việc IT <span>thông minh</span></h1>
            <p>
                Nền tảng tuyển dụng IT tích hợp trí tuệ nhân tạo AI.
                Kết nối ứng viên với cơ hội nghề nghiệp phù hợp.
            </p>
            <a class="button" href="#">Khám phá việc làm</a>
        </div>
    </main>
</body>
</html>
